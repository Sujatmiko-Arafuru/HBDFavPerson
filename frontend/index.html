<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Selamat Ulang Tahun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="intro-active">
  <div class="intro-splash" id="introSplash" aria-hidden="false">
    <div class="intro-splash-content" id="introSplashContent">
      <img
        class="intro-splash-icon"
        id="introSplashIcon"
        src="Laptop Icon/LaptopIcon.png"
        alt=""
        width="120"
        height="120"
        decoding="async"
      >
      <p class="intro-splash-text">
        USE <span class="intro-accent">LAPTOP</span> FOR BETTER<br>
        <span class="intro-accent">EXPERIENCE</span>
      </p>
    </div>
  </div>

  <div class="page">
    <video class="bg-video" autoplay muted loop playsinline preload="metadata">
      <source src="video/background.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="overlay"></div>
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <main class="container" id="mainContainer">
      <section class="card lock-card">
        <div class="card-header">
          <p class="hint">For The Favorite Person In My Life.</p>
          <h1>Only YOU Know The pattern</h1>
        </div>

        <div class="pattern-frame">
          <canvas id="patternCanvas" class="pattern-canvas" aria-hidden="true"></canvas>
          <div class="pattern-grid" id="patternGrid">
            <button class="dot" data-value="1" aria-label="Titik 1"></button>
            <button class="dot" data-value="2" aria-label="Titik 2"></button>
            <button class="dot" data-value="3" aria-label="Titik 3"></button>
            <button class="dot" data-value="4" aria-label="Titik 4"></button>
            <button class="dot" data-value="5" aria-label="Titik 5"></button>
            <button class="dot" data-value="6" aria-label="Titik 6"></button>
            <button class="dot" data-value="7" aria-label="Titik 7"></button>
            <button class="dot" data-value="8" aria-label="Titik 8"></button>
            <button class="dot" data-value="9" aria-label="Titik 9"></button>
          </div>
        </div>

        <div class="actions"></div>

      </section>

      <aside class="typewriter-panel hidden" id="typewriterPanel" aria-live="polite">
        <div class="typewriter-stage" id="typewriterStage">
          <p class="typewriter-line">
            <span id="typewriterText"></span><span class="typewriter-cursor" aria-hidden="true"></span>
          </p>
        </div>
        <div class="message-complete hidden" id="messageComplete">
          <p class="message-paragraph" id="messageParagraph"></p>
          <figure class="message-photo">
            <img id="messagePhoto" alt="" width="480" height="640" loading="lazy" decoding="async">
          </figure>
        </div>
      </aside>
    </main>

    <div class="notification-overlay hidden" id="notificationOverlay" role="dialog" aria-modal="true" aria-labelledby="notificationTitle">
      <div class="notification-reveal" id="notificationReveal">
        <div class="notification-bar notification-bar--top" id="notificationBarTop" aria-hidden="true"></div>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-glitch" id="notificationGlitch" aria-hidden="true">
            <span class="notification-glitch-slice"></span>
            <span class="notification-glitch-slice"></span>
            <span class="notification-glitch-slice"></span>
            <span class="notification-glitch-slice"></span>
          </div>
          <div class="notification-energy" aria-hidden="true"></div>
          <div class="notification-box" id="notificationBox">
            <div class="notification-frame-lines" aria-hidden="true">
              <span class="notification-frame-line notification-frame-line--left"></span>
              <span class="notification-frame-line notification-frame-line--right"></span>
            </div>
            <div class="notification-inner" id="notificationInner">
              <header class="notification-header">
                <span class="notification-icon" aria-hidden="true">!</span>
                <h2 class="notification-title" id="notificationTitle">NOTIFICATION</h2>
              </header>
              <p class="notification-body" id="notificationBody">
                Angelio Asa Triatmaja has sent a live birthday message, and you can watch it. Would you like to open it?
              </p>
              <div class="notification-buttons">
                <button type="button" class="notification-btn notification-btn--cancel" id="notificationCancel">REFUSE</button>
                <button type="button" class="notification-btn notification-btn--continue" id="notificationContinue">ACCEPT</button>
              </div>
            </div>
            <span class="notification-particle" aria-hidden="true"></span>
            <span class="notification-particle" aria-hidden="true"></span>
            <span class="notification-particle" aria-hidden="true"></span>
            <span class="notification-particle" aria-hidden="true"></span>
            <span class="notification-particle" aria-hidden="true"></span>
            <span class="notification-particle" aria-hidden="true"></span>
          </div>
        </div>
        <div class="notification-bar notification-bar--bottom" id="notificationBarBottom" aria-hidden="true"></div>
      </div>
    </div>

    <button type="button" class="video-finish-btn hidden" id="videoFinishBtn" aria-label="Selesai menonton">Finish</button>

    <div class="notification-video-overlay hidden" id="notificationVideoOverlay">
      <video class="notification-video" id="notificationVideo" playsinline controls preload="metadata"></video>
    </div>

    <audio id="notificationSound" class="notification-sound" preload="auto" src="Notification Media/System Sound.mp3"></audio>
    <audio id="backgroundMusic" class="background-music" preload="auto" loop="false"></audio>

    <div class="audio-controls hidden" id="audioControls">
      <div class="audio-controls-panel hidden" id="audioControlsPanel">
        <label class="audio-controls-label" for="audioVolumeSlider">Volume</label>
        <input
          type="range"
          id="audioVolumeSlider"
          class="audio-volume-slider"
          min="0"
          max="100"
          value="70"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="70"
        >
      </div>
      <button
        type="button"
        class="audio-controls-toggle"
        id="audioControlsToggle"
        aria-expanded="false"
        aria-controls="audioControlsPanel"
        aria-label="Atur volume musik"
      >
        <span class="audio-controls-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
