<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Ulang Tahun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="video/background.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="overlay"></div>
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <main class="container">
      <section class="card lock-card">
        <div class="card-header">
          <p class="hint">For The Favorite Person In My Life.</p>
          <h1>We Both Know The pattern</h1>
        </div>

        <div class="pattern-frame">
          <canvas id="patternCanvas" class="pattern-canvas" aria-hidden="true"></canvas>
          <div class="pattern-grid" id="patternGrid">
            <button class="dot" data-value="1" aria-label="Titik 1"></button>
            <button class="dot" data-value="2" aria-label="Titik 2"></button>
            <button class="dot" data-value="3" aria-label="Titik 3"></button>
            <button class="dot" data-value="4" aria-label="Titik 4"></button>
            <button class="dot" data-value="5" aria-label="Titik 5"></button>
            <button class="dot" data-value="6" aria-label="Titik 6"></button>
            <button class="dot" data-value="7" aria-label="Titik 7"></button>
            <button class="dot" data-value="8" aria-label="Titik 8"></button>
            <button class="dot" data-value="9" aria-label="Titik 9"></button>
          </div>
        </div>

        <div class="actions"></div>

      </section>

      <section class="card message-card hidden" id="messageCard">
        <div class="message-icon">
          <svg viewBox="0 0 100 100" class="heart-svg" aria-hidden="true">
            <path d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.7 16.7 21.2s25.4-9.5 34.9 0c0.9 0.9 1.8 1.9 2.5 2.9 0.7-1 1.6-1.9 2.5-2.9 9.5-9.5 25.4-9.5 34.9 0s9.5 25.4 0 34.9L50 88.9z" fill="url(#heartGrad)" />
            <defs>
              <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff5e62" />
                <stop offset="100%" stop-color="#ff9966" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2 class="animate-text">Selamat Ulang Tahun! 🎉</h2>
        <p class="animate-text">Semoga semua harimu penuh dengan cinta, tawa, dan kebahagiaan yang tak terbatas.</p>
        <p class="animate-text">Ini khusus untukmu, dari seseorang yang selalu ingin melihat senyum terbaik di wajahmu. ❤️</p>
        <div class="message-footer">
          <button class="button primary" id="celebrateBtn">Kirim Pelukan! 🤗</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
